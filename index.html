<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunbeam</title>

    <link rel="stylesheet" href="style.css" />
    <script src="main.js" defer></script>
</head>

</head>
<body>
    <header>
        <div class="stingray">
            <img src = "https://sunbeam.hackclub.com/imgs/ray1.webp" alt = "Sunray"> 

            <div class="dialogue-box">
                <p id="speaker">Sunray</p>
                <p id="dialogue-text">Hello there!</p>
                <button id="next-btn">Next</button>
                <button id="makeDrink">Make the Drink!</button>
            </div>
        </div>
    </header>
    
    <img id = "frontDoor" class="store1" src = "https://static.vecteezy.com/system/resources/thumbnails/082/009/680/small/minimart-storefront-in-the-city-illustration-small-retail-storefront-in-urban-area-city-minimarket-shop-urban-convenience-store-vector.jpg">
    <img id = "counterTop" src = "https://media.discordapp.net/attachments/1543300148895944845/1543365110557577226/image.png?ex=6a949a44&is=6a9348c4&hm=42e33b653f14e38febb42bd12004e203ab66faaee957d458440c14d8a79c161d&=&format=webp&quality=lossless">

    <main id="game-screen">
        <div class="counter">

            <div class="customer1">
                <img src = "https://sunbeam.hackclub.com/imgs/shark1.webp" alt="Customer">
            </div>

            <div class="drink maker">
                <h3> Drinks! </h3>
                <p> Click on the drink! </p>

                <!-- copied -->
                <div class="button-group">

                    <button class="ingredient-btn" data-item="Milk">🥛 </button>
                    <button class="ingredient-btn" data-item="Coke Alcohol"> 🍺 Pour Coke</button>
                    <button class="ingredient-btn" data-item="Fish">🐠 Add Lemon</button>
                    <button class="ingredient-btn" data-item="Fizzy Water">🫗 Add Fizzy Water</button>

                </div>
                <div class="current-drink">
                    <p>Current Cup: <span id="cup-contents">Empty</span></p>
                    <button id="serve-btn">Serve Drink</button>
                    <button id="reset-btn">Trash Cup</button>
                </div>
            </div>

        </div> 

    </main>

</body>
</html>
